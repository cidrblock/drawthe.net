diagram:
  fill: "white"
  rows: 16
  columns: 18
  gridLines: false
  groupPadding: 0.3

title:
  color: "black"
  fill: "white"
  logoFill: "none"
  stroke: "black"
  text: "Hybrid Developer Platform"
  subText: "AWS edge, private fabric, resilient services, data, and operations"
  type: "bar"
  heightPercentage: 6

icons:
  users:
    iconFamily: "aws"
    icon: "gen_user"
    text: "Users"
    x: 1
    y: 14
    color: "black"
    fill: "white"
    stroke: "#334155"

  dns:
    iconFamily: "aws2026"
    icon: "amazon_route_53"
    text: "Route 53"
    x: 4
    y: 14
    color: "black"
