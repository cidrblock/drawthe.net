diagram:
  fill: "white"
  rows: 7
  columns: 9
  gridLines: false

title:
  color: "black"
  fill: "white"
  logoFill: "none"
  stroke: "black"
  text: "Connection Line Styles"
  subText: "Canned strokes preserve the same endpoint, curve, and label geometry"
  type: "bar"
  heightPercentage: 6

icons:
  source:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Router"
    x: 1
    y: 3
    color: "black"
    fill: "white"
    stroke: "#334155"
  solid_target:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Solid"
    x: 7
    y: 6
    color: "black"
    fill: "white"
    stroke: "#334155"
  dashed_target:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Dashed"
    x: 7
    y: 5
    color: "black"
    fill: "white"
    stroke: "#334155"
  dotted_target:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Dotted"
    x: 7
    y: 4
    color: "black"
    fill: "white"
    stroke: "#334155"
  dashdot_target:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Dash-dot"
    x: 7
    y: 2
    color: "black"
    fill: "white"
    stroke: "#334155"
  double_target:
    iconFamily: "cisco2026"
    icon: "router"
    text: "Double"
    x: 7
    y: 1
    color: "black"
    fill: "white"
    stroke: "#334155"

connections:
  - endpoints: [source, solid_target]
    label: "solid"
    lineStyle: solid
    color: "#2563eb"
    stroke: "#2563eb"
  - endpoints: [source, dashed_target]
    label: "dashed"
    lineStyle: dashed
    color: "#dc2626"
    stroke: "#dc2626"
  - endpoints: [source, dotted_target]
    label: "dotted"
    lineStyle: dotted
    color: "#059669"
    stroke: "#059669"
  - endpoints: [source, dashdot_target]
    label: "dash-dot"
    lineStyle: dashDot
    color: "#d97706"
    stroke: "#d97706"
  - endpoints: [source, double_target]
    label: "double"
    lineStyle: double
    color: "#7c3aed"
    stroke: "#7c3aed"
